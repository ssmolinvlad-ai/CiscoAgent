[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-tracer-lab-agent"
version = "0.1.0"
description = "Автономное выполнение лабораторных Cisco Packet Tracer"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.8,<6.11", "PyAutoGUI>=0.9.54,<1", "pywinauto>=0.6.8,<1; sys_platform=='win32'",
  "opencv-python>=4.10,<5", "Pillow>=11,<14", "PyMuPDF>=1.25,<2", "python-docx>=1.1,<2",
  "pydantic>=2.11,<3", "httpx>=0.28,<1", "mcp>=1.13,<2", "jsonschema>=4.23,<5", "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]
bridge = ["packet-tracer-mcp==0.11.0"]

[project.gui-scripts]
packet-tracer-agent = "ptagent.gui:main"

[tool.setuptools.packages.find]
include = ["ptagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
